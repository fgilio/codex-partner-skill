# Mirrors the CI format and lint gates on the staged files. Type checks and
# tests run in CI behind ci-success. Installed by `bun install` through the
# lefthook package's postinstall. Never bypass with --no-verify.
# `bun run` starts the tools from node_modules, at the versions bun.lock
# pins, under Bun, so no Node install is needed. A missing `bun install`
# fails the hook instead of fetching a release.
min_version: 2.1.9
glob_matcher: doublestar

pre-commit:
  # The formatters read configs they may rewrite, so the jobs run in order.
  parallel: false
  jobs:
    - name: fix:ts-lint
      run: bun run oxlint --type-aware --deny-warnings --no-error-on-unmatched-pattern --fix {staged_files}
      glob: "**/*.{ts,mts,cts,tsx,js,mjs,cjs,jsx}"
      stage_fixed: true
    - name: fix:ts-format
      run: bun run oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      glob: "**/*.{ts,mts,cts,tsx,js,mjs,cjs,jsx}"
      stage_fixed: true
    - name: fix:config
      run: bun run oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      glob: "**/*.{json,jsonc,yml,yaml,toml}"
      stage_fixed: true
    - name: fix:docs
      run: bun run oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      glob: "**/*.{md,mdx}"
      stage_fixed: true
    # --no-globs keeps markdownlint to the staged files. It fixes what it
    # can, and a finding that needs a person stops the commit.
    - name: fix:docs-lint
      run: bun run markdownlint-cli2 --fix --no-globs {staged_files}
      glob: "**/*.{md,mdx}"
      stage_fixed: true
